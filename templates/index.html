<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PyBot — Python &amp; AI Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --surface: #191e26;
    --surface-2: #1f2530;
    --border: #2a303c;
    --text: #e9ebef;
    --text-muted: #8b93a3;
    --blue: #5b9bd1;
    --blue-dim: #3a6f96;
    --yellow: #ffd43b;
    --red: #e8697a;
    --radius-lg: 18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  ::selection{ background: var(--blue-dim); color: #fff; }

  /* ---------- Header ---------- */
  header{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    opacity: 0;
    animation: rise 0.5s ease-out forwards;
  }

  .mark{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    position: relative;
    flex-shrink: 0;
    background: linear-gradient(155deg, var(--blue) 0%, var(--blue) 52%, var(--yellow) 52%, var(--yellow) 100%);
  }
  .mark::before, .mark::after{
    content:"";
    position:absolute;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--bg);
  }
  .mark::before{ top:7px; left:7px; }
  .mark::after{ bottom:7px; right:7px; }

  .brand{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing: -0.01em;
  }
  .brand-sub{
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .status{
    margin-left: auto;
    display:flex;
    align-items:center;
    gap:7px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .status-dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--blue);
    box-shadow: 0 0 0 0 rgba(91,155,209,.5);
    animation: breathe 2.6s ease-in-out infinite;
  }

  /* ---------- Chat area ---------- */
  main{
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  #chat{
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1;
  }

  /* ---------- Empty state ---------- */
  .hero{
    margin: auto 0;
    padding: 40px 4px 20px;
    opacity: 0;
    animation: rise 0.55s ease-out 0.12s forwards;
  }
  .hero h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(26px, 4vw, 34px);
    line-height: 1.25;
    margin: 0 0 10px;
    max-width: 480px;
  }
  .hero p{
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 0 22px;
  }
  .chips{
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
  }
  .chip{
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    font-family: 'Inter', sans-serif;
  }
  .chip:hover{ border-color: var(--blue-dim); background: var(--surface-2); }
  .chip:focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------- Messages ---------- */
  .msg{
    display: flex;
    max-width: 100%;
    animation: msgIn .28s ease-out;
  }
  .msg.user{ justify-content: flex-end; }
  .msg.assistant{ justify-content: flex-start; }

  .bubble{
    max-width: 82%;
    padding: 13px 16px;
    font-size: 14.5px;
    line-height: 1.65;
    word-wrap: break-word;
  }

  .msg.user .bubble{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
  }

  .msg.assistant .bubble{
    background: var(--surface);
    border-left: 2px solid var(--yellow);
    border-radius: 3px var(--radius-sm) var(--radius-sm) 3px;
    padding-left: 15px;
  }

  .msg.error .bubble{
    border-left: 2px solid var(--red);
  }

  .bubble code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .bubble pre{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: #0d1015;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    overflow-x: auto;
    margin: 8px 0;
    line-height: 1.55;
  }
  .bubble pre code{ background: none; padding: 0; }
  .bubble strong{ color: #fff; font-weight: 600; }
  .bubble ul, .bubble ol{ margin: 6px 0; padding-left: 20px; }
  .bubble li{ margin: 3px 0; }
  .bubble p{ margin: 0 0 8px; }
  .bubble p:last-child{ margin-bottom: 0; }

  /* ---------- Typing indicator ---------- */
  .typing .bubble{
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 15px 16px;
  }
  .typing span{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: dot 1.1s ease-in-out infinite;
  }
  .typing span:nth-child(2){ animation-delay: .15s; }
  .typing span:nth-child(3){ animation-delay: .3s; }

  /* ---------- Composer ---------- */
  .composer-wrap{
    border-top: 1px solid var(--border);
    padding: 14px 20px 18px;
    flex-shrink: 0;
  }
  .composer{
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 8px 8px 8px 16px;
    transition: border-color .15s ease;
  }
  .composer:focus-within{ border-color: var(--blue-dim); }

  #input{
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 160px;
    padding: 8px 0;
  }
  #input::placeholder{ color: var(--text-muted); }

  #send{
    width: 38px;
    height: 38px;
    border-radius: 11px;
    border: none;
    background: var(--blue);
    color: #0d1015;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s ease, transform .1s ease;
  }
  #send:hover:not(:disabled){ background: #6ba9df; }
  #send:active:not(:disabled){ transform: scale(0.94); }
  #send:disabled{ background: var(--surface-2); color: var(--text-muted); cursor: not-allowed; }
  #send:focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; }

  .hint{
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 9px;
  }

  /* ---------- Scrollbar ---------- */
  main::-webkit-scrollbar{ width: 8px; }
  main::-webkit-scrollbar-thumb{ background: var(--surface-2); border-radius: 8px; }
  main::-webkit-scrollbar-track{ background: transparent; }

  /* ---------- Animations ---------- */
  @keyframes rise{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes msgIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes breathe{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(91,155,209,.45); }
    50%{ box-shadow: 0 0 0 4px rgba(91,155,209,0); }
  }
  @keyframes dot{
    0%, 60%, 100%{ transform: translateY(0); opacity: .5; }
    30%{ transform: translateY(-3px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }

  @media (max-width: 560px){
    .bubble{ max-width: 90%; }
    header{ padding: 14px 16px; }
    .composer-wrap{ padding: 12px 14px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="mark" aria-hidden="true"></div>
  <div class="brand">
    <span class="brand-name">PyBot</span>
    <span class="brand-sub">Python &amp; AI tutor</span>
  </div>
  <div class="status">
    <span class="status-dot" aria-hidden="true"></span>
    <span>Online</span>
  </div>
</header>

<main id="main">
  <div id="chat">
    <div class="hero" id="hero">
      <h1>Let's learn Python.</h1>
      <p>Ask about Python, AI, machine learning, or software development — PyBot breaks it down step by step, with examples and a quick exercise.</p>
      <div class="chips">
        <button class="chip" type="button">What's a list comprehension?</button>
        <button class="chip" type="button">Explain gradient descent simply</button>
        <button class="chip" type="button">Why do I get an IndexError?</button>
        <button class="chip" type="button">Difference between AI and ML</button>
      </div>
    </div>
  </div>
</main>

<div class="composer-wrap">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask PyBot something..." maxlength="4000"></textarea>
    <button id="send" type="button" aria-label="Send message">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <div class="hint">Enter to send · Shift + Enter for a new line</div>
</div>

<script>
  const chat = document.getElementById('chat');
  const hero = document.getElementById('hero');
  const main = document.getElementById('main');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let history = [];
  let busy = false;

  // Autosize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.textContent;
      input.dispatchEvent(new Event('input'));
      send();
    });
  });

  function escapeHtml(str){
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // Small, safe markdown-lite renderer: fenced code, inline code, bold, lists, paragraphs
  function renderMarkdown(raw){
    const escaped = escapeHtml(raw);
    const withCodeBlocks = escaped.replace(/```([\s\S]*?)```/g, (_, code) => {
      return `<pre><code>${code.trim()}</code></pre>`;
    });

    const lines = withCodeBlocks.split('\n');
    let html = '';
    let inList = false;
    let paragraph = [];

    const flushParagraph = () => {
      if (paragraph.length) {
        html += `<p>${paragraph.join('<br>')}</p>`;
        paragraph = [];
      }
    };

    for (const line of lines) {
      if (line.startsWith('<pre>')) {
        flushParagraph();
        if (inList) { html += '</ul>'; inList = false; }
        html += line;
        continue;
      }
      const listMatch = line.match(/^\s*[-*]\s+(.*)/);
      if (listMatch) {
        flushParagraph();
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inline(listMatch[1])}</li>`;
        continue;
      }
      if (inList) { html += '</ul>'; inList = false; }

      if (line.trim() === '') {
        flushParagraph();
      } else {
        paragraph.push(inline(line));
      }
    }
    flushParagraph();
    if (inList) html += '</ul>';
    return html;
  }

  function inline(text){
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+?)`/g, '<code>$1</code>');
  }

  function addMessage(role, content, opts = {}){
    if (hero && hero.parentNode) hero.remove();

    const wrap = document.createElement('div');
    wrap.className = `msg ${role}${opts.error ? ' error' : ''}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(content);

    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    main.scrollTop = main.scrollHeight;
    return wrap;
  }

  function addTyping(){
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant typing';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = '<div class="bubble"><span></span><span></span><span></span></div>';
    chat.appendChild(wrap);
    main.scrollTop = main.scrollHeight;
  }

  function removeTyping(){
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function send(){
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    input.value = '';
    input.style.height = 'auto';
    addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok || data.status === 'error') {
        addMessage('assistant', data.reply || 'Something went wrong. Please try again.', { error: true });
      } else {
        addMessage('assistant', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      removeTyping();
      addMessage('assistant', 'Could not reach the server. Check your connection and try again.', { error: true });
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>

</body>
</html>
